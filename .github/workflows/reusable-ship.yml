# Workflow reutilizável: build da imagem -> push no GHCR -> deploy por SSH no VPS
# (`docker compose pull && up -d`). Cada repo de serviço chama este arquivo.
#
# Uso no repo consumidor (.github/workflows/ship.yml):
#
#   name: ship
#   on:
#     push:
#       branches: [main]
#   jobs:
#     ship:
#       uses: andersonandredev/iacheiofertas-platform/.github/workflows/reusable-ship.yml@main
#       with:
#         image_name: iacheiofertas-core
#         service: core
#       secrets: inherit
#
# Secrets esperados no repo consumidor (ou na org): SSH_HOST, SSH_USER, SSH_KEY, DEPLOY_DIR

on:
  workflow_call:
    inputs:
      image_name:
        description: nome da imagem no GHCR (bate com o nome do repo)
        required: true
        type: string
      service:
        description: serviço do compose pra atualizar no deploy (vazio = stack inteira)
        required: false
        default: ""
        type: string
      context:
        description: contexto de build do Docker
        required: false
        default: "."
        type: string
      dockerfile:
        description: caminho do Dockerfile
        required: false
        default: "Dockerfile"
        type: string
      deploy:
        description: rodar o job de deploy depois do build
        required: false
        default: true
        type: boolean
      runs_on:
        required: false
        default: ubuntu-latest
        type: string
    secrets:
      SSH_HOST:
        required: false
      SSH_USER:
        required: false
      SSH_KEY:
        required: false
      DEPLOY_DIR:
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ inputs.runs_on }}
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Metadata
        id: meta
        run: |
          echo "image=ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:main
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: ${{ inputs.deploy }}
    runs-on: ${{ inputs.runs_on }}
    concurrency:
      group: deploy-${{ inputs.image_name }}
      cancel-in-progress: false
    steps:
      - name: Guard — secrets de deploy presentes
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ] || [ -z "${{ secrets.SSH_KEY }}" ]; then
            echo "::error::SSH_HOST/SSH_KEY ausentes — configure os secrets ou passe deploy: false"
            exit 1
          fi

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_DIR }}"
            git -C . pull --ff-only || true
            SVC="${{ inputs.service }}"
            docker compose pull $SVC
            docker compose up -d $SVC
            docker compose ps
