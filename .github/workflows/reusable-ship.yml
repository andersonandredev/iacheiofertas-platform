# Workflow reutilizável: build da imagem -> push no GHCR -> deploy por SSH no VPS
# (`docker compose pull && up -d`). Cada repo de serviço chama este arquivo.
#
# Uso no repo consumidor (.github/workflows/ship.yml):
#
#   name: ship
#   on:
#     push:
#       branches: [main]
#   jobs:
#     ship:
#       uses: andersonandredev/iacheiofertas-platform/.github/workflows/reusable-ship.yml@main
#       with:
#         image_name: iacheiofertas-core
#         service: core
#       secrets: inherit
#
# Secrets esperados no repo consumidor (ou na org): SSH_HOST, SSH_USER, SSH_KEY, DEPLOY_DIR
# + CORE_CLIENT_DEPLOY_KEY (deploy key read-only do iacheiofertas-core-client — só quem
# instala o SDK via `pip install git+ssh://...` no requirements.txt precisa dela;
# consumidor sem essa linha simplesmente não usa o secret).

on:
  workflow_call:
    inputs:
      image_name:
        description: nome da imagem no GHCR (bate com o nome do repo)
        required: true
        type: string
      service:
        description: serviço do compose pra atualizar no deploy (vazio = stack inteira)
        required: false
        default: ""
        type: string
      context:
        description: contexto de build do Docker
        required: false
        default: "."
        type: string
      dockerfile:
        description: caminho do Dockerfile
        required: false
        default: "Dockerfile"
        type: string
      deploy:
        description: rodar o job de deploy depois do build
        required: false
        default: true
        type: boolean
      runs_on:
        required: false
        default: ubuntu-latest
        type: string
    secrets:
      SSH_HOST:
        required: false
      SSH_USER:
        required: false
      SSH_KEY:
        required: false
      DEPLOY_DIR:
        required: false
      CORE_CLIENT_DEPLOY_KEY:
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ inputs.runs_on }}
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Metadata
        id: meta
        run: |
          echo "image=ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `secrets.*` não pode ser referenciado direto num `if:`/`with:` de step — só
      # dentro de `env:`/`run:` (restrição do parser de expressões do Actions). Calcula
      # presença aqui e usa o output nos passos seguintes.
      - name: Detecta se há deploy key do core-client
        id: core_client_key
        env:
          KEY: ${{ secrets.CORE_CLIENT_DEPLOY_KEY }}
        run: echo "present=$([ -n "$KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Repassa a deploy key do iacheiofertas-core-client pro build via BuildKit SSH
      # forwarding (`RUN --mount=type=ssh` no Dockerfile) — a chave nunca é gravada numa
      # camada da imagem. Sem efeito nos repos que não usam a chave (ex: iacheiofertas-
      # platform, que não builda nada aqui).
      - name: SSH agent (deploy key do core-client)
        if: steps.core_client_key.outputs.present == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CORE_CLIENT_DEPLOY_KEY }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          ssh: ${{ steps.core_client_key.outputs.present == 'true' && 'default' || '' }}
          tags: |
            ${{ steps.meta.outputs.image }}:main
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: ${{ inputs.deploy }}
    runs-on: ${{ inputs.runs_on }}
    concurrency:
      group: deploy-${{ inputs.image_name }}
      cancel-in-progress: false
    steps:
      - name: Guard — secrets de deploy presentes
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ] || [ -z "${{ secrets.SSH_KEY }}" ]; then
            echo "::error::SSH_HOST/SSH_KEY ausentes — configure os secrets ou passe deploy: false"
            exit 1
          fi

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_DIR }}"
            git -C . pull --ff-only || true
            SVC="${{ inputs.service }}"
            docker compose pull $SVC
            docker compose up -d $SVC
            docker compose ps
